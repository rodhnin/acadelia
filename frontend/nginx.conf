server {
    listen 80;
    server_name _;
    
    # ⭐ RESOLVER DNS PARA DOCKER - CRÍTICO
    resolver 127.0.0.11 valid=30s ipv6=off;
    
    # Configuración de seguridad
    server_tokens off;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # Configuración de compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Root y index
    root /usr/share/nginx/html;
    index index.html;

    # ⭐ VARIABLE DINÁMICA PARA BACKEND
    set $backend_host "backend";
    set $backend_port "5000";

    # ⭐ ARCHIVOS ESTÁTICOS - Cache optimizado
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ⭐ PROXY PARA API - CON RESOLUCIÓN DINÁMICA
    location /api {
        # ⭐ CRÍTICO: Usar variables para evitar resolución al startup
        proxy_pass http://$backend_host:$backend_port;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # ⭐ HEADERS CSRF ESPECÍFICOS - CRÍTICO PARA FUNCIONALIDAD
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-XSRF-Token $http_x_xsrf_token;
        proxy_set_header csrf-token $http_csrf_token;
        proxy_set_header Cookie $http_cookie;
        
        # ⭐ HEADERS CORS COMPLETOS
        proxy_set_header Origin $http_origin;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
        
        # Timeouts optimizados
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer sizes para mejor rendimiento
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # ⭐ MANEJO DE ERRORES BACKEND
        error_page 502 503 504 = @backend_error;
    }

    # ⭐ PÁGINA DE ERROR PARA BACKEND NO DISPONIBLE
    location @backend_error {
        add_header Content-Type application/json;
        return 503 '{"error":"Backend service temporarily unavailable","code":"SERVICE_UNAVAILABLE"}';
    }

    # ⭐ PÁGINA PRINCIPAL
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ⭐ RUTAS DE AUTH (públicas)
    location ~ ^/(login|register_perfil|reset-password|verify-email|delete-account)$ {
        try_files /views/auth/$1.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ⭐ RUTAS DE ERROR (públicas)
    location ~ ^/(402|403|404|429|500|503|ban)$ {
        try_files /views/error/$1.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ⭐ RUTAS OTHER (públicas)
    location ~ ^/(contact|faq|cookie_privacy|terminos_condiciones|precios)$ {
        try_files /views/other/$1.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ⭐ DASHBOARD (requieren autenticación - proxy al backend)
    location ~ ^/(principal|cuenta|misavas)$ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        # Timeouts para páginas
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Manejo de errores
        error_page 502 503 504 = @backend_error;
    }

    # ⭐ PAYMENTS (requieren autenticación - proxy al backend)
    location ~ ^/(tienda|paymenthistory|estatus)$ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        error_page 502 503 504 = @backend_error;
    }

    # ⭐ CONTENT/HERRAMIENTAS (requieren autenticación - proxy al backend)
    location ~ ^/(pdf|agente)$ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        error_page 502 503 504 = @backend_error;
    }

    # ⭐ CONTENT MEDICINA (requieren autenticación - proxy al backend)
    location ~ ^/(patologia|Semiologia|CienciasBasicas|medicinainterna|CienciasAplicadas|CirugiaYUrgencias|EspecialidadesMed1|EspecialidadesMedicasII|Epidemiologia|MatematicaMedica)$ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        error_page 502 503 504 = @backend_error;
    }

    # ⭐ CONTENT INGENIERÍA (requieren autenticación - proxy al backend)
    location ~ ^/(fisica|Algebra|Calculo|Quimica|Estadistica|ResistenciaMateriales|ElectricidadElectronica|MatematicaAvz|ComputacionSistemas|RedesSeguridad)$ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        error_page 502 503 504 = @backend_error;
    }

    # ⭐ CONTENT ECONOMÍA (requieren autenticación - proxy al backend)
    location ~ ^/(desarrolloeconomico|economialaboral|historiaeconomica|macroeconomia|sectorpublico|microeconomia|econometria|economiainternacional|finanzas|calculoeconomico)$ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        error_page 502 503 504 = @backend_error;
    }

    # ⭐ ADMIN (requieren autenticación admin - proxy al backend)
    location ~ ^/(chiguiremarketing|seguridad|administracion|chiguiremente|administracion_arg)$ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        
        error_page 502 503 504 = @backend_error;
    }

    # ⭐ ARCHIVOS ESTÁTICOS ESPECÍFICOS (desde public/)
    location /css/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /scripts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ⭐ FALLBACK: 404 para todo lo demás
    location / {
        try_files $uri $uri/ /views/error/404.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}